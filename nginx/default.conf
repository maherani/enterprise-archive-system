upstream nextcloud_backend {
    server app:80;
}

server {
    listen 80;
    server_name localhost docs.maskan;

    client_max_body_size 10G;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Strip upstream Nextcloud CSP header to eliminate external domains (e.g. tile.openstreetmap.org)
    proxy_hide_header Content-Security-Policy;

    # Air-Gapped Content Security Policy: strictly enforce local-only origins
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none';" always;

    # Block external help and documentation routes
    location ~* ^/(index\.php/)?settings/help {
        return 403 "External documentation is disabled in this air-gapped archive system.";
    }

    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    # Disaster Recovery & Maintenance error handling
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        proxy_pass http://nextcloud_backend;
        proxy_redirect off;
    }
}
