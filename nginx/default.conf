upstream nextcloud_backend {
    server app:80;
}

server {
    listen 80;
    server_name localhost docs.maskan;

    charset utf-8;
    charset_types text/css text/plain text/vnd.wap.wml application/javascript text/javascript application/json text/xml application/xml;

    client_max_body_size 10G;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Strip upstream Nextcloud CSP header to eliminate external domains (e.g. tile.openstreetmap.org)
    proxy_hide_header Content-Security-Policy;

    # Air-Gapped Content Security Policy: strictly enforce local-only origins
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none';" always;

    # Block external help and documentation routes
    location ~* ^/(index\.php/)?settings/help {
        return 403 "External documentation is disabled in this air-gapped archive system.";
    }

    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    # Disaster Recovery & Maintenance error handling
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location ~* \.(?:css|js)$ {
        proxy_pass http://nextcloud_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none';" always;
    }

    # AI Box Gateway Restricted Reverse Proxy
    location ~* ^/ai-gateway/(?:api/)?(?:v1/)?(?:admin|system|document|upload) {
        return 403 '{"error": "Access denied: Endpoint not permitted through AI Gateway."}';
        default_type application/json;
    }

    location = /ai-gateway/api/v1/workspaces {
        limit_except GET OPTIONS {
            deny all;
        }
        rewrite ^/ai-gateway/(.*)$ /$1 break;
        proxy_pass http://ai_box_gateway:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header OCS-APIRequest $http_ocs_apirequest;
        proxy_set_header Origin $http_origin;
        proxy_hide_header X-Powered-By;
    }

    location ~ ^/ai-gateway/api/workspace/([a-zA-Z0-9_\-]+)/(chat|stream-chat)$ {
        limit_except POST OPTIONS {
            deny all;
        }
        rewrite ^/ai-gateway/(.*)$ /$1 break;
        proxy_pass http://ai_box_gateway:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header OCS-APIRequest $http_ocs_apirequest;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Archive-Chat $http_x_archive_chat;

        # Streaming optimizations for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        proxy_hide_header X-Powered-By;
    }

    location /ai-gateway/ {
        return 403 '{"error": "Access denied: Endpoint not allowed."}';
        default_type application/json;
    }

    location / {
        proxy_pass http://nextcloud_backend;
        proxy_redirect off;
    }
}
